<script>
  let rawData = [];

  const tbody = document.getElementById('table-body');
  const updatedAtElem = document.getElementById('updated-at');
  const filterInput = document.getElementById('filter-input');
  const sortSelect = document.getElementById('sort-select');
  const officialOnly = document.getElementById('official-only');
  const inStockOnly = document.getElementById('in-stock-only');
  const catConsole = document.getElementById('cat-console');
  const catSoft = document.getElementById('cat-soft');
  const catController = document.getElementById('cat-controller');
  const thTop3Title = document.getElementById('th-top3-title');

  const rankBadges = ['🥇 1位', '🥈 2位', '🥉 3位'];
  const rankClasses = ['rank-1', 'rank-2', 'rank-3'];

  async function loadData() {
    let data = null;
    try {
      const res = await fetch('./data.json?t=' + Date.now());
      if (res.ok) data = await res.json();
    } catch(e) {
      console.log("JSON fetch error:", e);
    }

    if (!data) {
      if (window.KADEN_DATA && window.KADEN_DATA.length > 0) data = window.KADEN_DATA;
      else if (window.GAME_DATA && window.GAME_DATA.length > 0) data = window.GAME_DATA;
    }

    if (!data) {
      await new Promise((resolve) => {
        const sc = document.createElement('script');
        sc.src = './data.js?t=' + Date.now();
        sc.onload = () => {
          data = window.KADEN_DATA || window.GAME_DATA || null;
          resolve();
        };
        sc.onerror = () => resolve();
        document.head.appendChild(sc);
      });
    }

    if (data && data.length > 0) {
      rawData = data;
      const firstItem = rawData.find(it => it.updated_at);
      if (firstItem && firstItem.updated_at) {
        updatedAtElem.textContent = '最終更新: ' + firstItem.updated_at;
      }
      render();
    } else {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 40px; color: red;">データが読み込めません。<br>（GitHub Pagesの配信反映待ちか、ファイルを確認してください）<br><button onclick="loadData()" style="margin-top:12px; padding:6px 16px; border:1px solid #ccc; border-radius:6px; cursor:pointer;">再試行 🔄</button></td></tr>`;
    }
  }

  function createInfeedRowHtml() {
    return `
      <tr class="infeed-row">
        <td colspan="3">
          <span class="infeed-label">― SPONSORED ―</span>
          <div class="infeed-box">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-9014722014583256"
                 data-ad-slot="7138671333"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
          </div>
        </td>
      </tr>
    `;
  }

  function render() {
    if (!rawData || rawData.length === 0) return;

    const isOfficial = officialOnly.checked;
    const rankLimit = parseInt(document.querySelector('input[name="rank-limit"]:checked').value, 10);
    const scopeLabel = isOfficial ? '正規取扱店' : '市場全体';
    const limitLabel = rankLimit === 1 ? '最安1位' : '安値TOP3';
    thTop3Title.textContent = `${scopeLabel} ${limitLabel} (ショップ / 仕入価格 / 見込利益・損失 / リンク)`;

    const keyword = filterInput.value.toLowerCase().trim();
    const sortMode = sortSelect.value;
    const isInStockOnly = inStockOnly.checked;

    const filterConsole = catConsole.checked;
    const filterSoft = catSoft.checked;
    const filterController = catController.checked;
    const useGameSubFilter = filterConsole || filterSoft || filterController;

    let items = rawData.filter(it => {
      const cat = it.category || '';
      if ((cat === '電子タバコ') || /iqos|iluma|glo|ploom|アイコス|グロー/i.test(it.name || '')) return false;

      if (useGameSubFilter) {
        let match = false;
        if (filterConsole && (cat === 'ゲーム機本体' || /switch|playstation|xbox|ps5/i.test(it.name || ''))) match = true;
        if (filterSoft && cat === 'ゲームソフト') match = true;
        if (filterController && (cat === 'コントローラー' || /joy-con|dualsense/i.test(it.name || ''))) match = true;
        if (!match) return false;
      }

      // 正規店のみON時は公式在庫を優先、なければ市場最安店をフォールバック
      let targetTop = [];
      if (isOfficial) {
        targetTop = (it.official_top3 && it.official_top3.length > 0) ? it.official_top3 : (it.all_top3 || []);
      } else {
        targetTop = it.all_top3 || [];
      }

      if (isInStockOnly && targetTop.length === 0) return false;

      if (keyword) {
        const name = (it.name || '').toLowerCase();
        const memo = (it.memo || '').toLowerCase();
        const jan = (it.jan || '').toLowerCase();
        const shops = targetTop.map(t => (t.shop || '').toLowerCase()).join(' ');
        if (!name.includes(keyword) && !memo.includes(keyword) && !jan.includes(keyword) && !shops.includes(keyword)) {
          return false;
        }
      }
      return true;
    });

    items.sort((a, b) => {
      const topA_list = isOfficial 
        ? ((a.official_top3 && a.official_top3.length > 0) ? a.official_top3 : (a.all_top3 || []))
        : (a.all_top3 || []);
      const topB_list = isOfficial 
        ? ((b.official_top3 && b.official_top3.length > 0) ? b.official_top3 : (b.all_top3 || []))
        : (b.all_top3 || []);

      const topA = topA_list.length > 0 ? topA_list[0] : null;
      const topB = topB_list.length > 0 ? topB_list[0] : null;
      
      const profitA = topA ? topA.profit : -999999;
      const profitB = topB ? topB.profit : -999999;
      const rateA = topA ? topA.profit_rate : -999999;
      const rateB = topB ? topB.profit_rate : -999999;

      if (sortMode === 'profit_rate_desc') return rateB - rateA;
      if (sortMode === 'profit_amount_desc') return profitB - profitA;
      if (sortMode === 'profit_asc') {
        if (!topA) return 1;
        if (!topB) return -1;
        return profitA - profitB;
      }
      if (sortMode === 'buy_desc') return (b.buy_price || 0) - (a.buy_price || 0);
      return 0;
    });

    if (items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 30px; color:#6b7280;">表示対象の商品がありません</td></tr>`;
      return;
    }

    let rowsHtml = '';
    items.forEach((it, idx) => {
      const buyStr = it.buy_price ? '¥' + it.buy_price.toLocaleString() : '-';
      
      // ★ 正規店のみONの時：公式在庫があればそれを優先、完売時のみ市場最安店をフォールバック提示
      let fullTopList = [];
      let isFallbackToGeneral = false;
      if (isOfficial) {
        if (it.official_top3 && it.official_top3.length > 0) {
          fullTopList = it.official_top3;
        } else if (it.all_top3 && it.all_top3.length > 0) {
          fullTopList = it.all_top3;
          isFallbackToGeneral = true;
        }
      } else {
        fullTopList = it.all_top3 || [];
      }

      const topList = fullTopList.slice(0, rankLimit);
      const hasStock = topList.length > 0;
      const memoHtml = it.memo ? `<div class="memo-tag">${it.memo}</div>` : '';
      
      const chomeHref = (it.chome_url && it.chome_url.startsWith('https://www.1-chome.com/wineDetail/'))
        ? it.chome_url
        : `https://www.1-chome.com/electricAppliance?category=10000005`;

      const nameHtml = `<a href="${chomeHref}" target="_blank" rel="noopener noreferrer" class="item-name" title="買取一丁目の詳細ページを開く">${it.name}<span class="chome-link-icon">🔗</span></a>`;

      let topHtml = '';
      if (!hasStock) {
        topHtml = `<div class="no-stock">現在、楽天市場に新品の在庫が見つかりません</div>`;
      } else {
        topHtml = topList.map((shopData, i) => {
          const postBadge = (shopData.postage_flag === 1)
            ? `<span class="postage-badge postage-free">無料</span>`
            : `<span class="postage-badge postage-paid">別⚠️</span>`;

          const typeBadge = shopData.is_official
            ? `<span class="shop-type-badge type-official">正規</span>`
            : `<span class="shop-type-badge type-general">一般</span>`;

          const isPlus = shopData.profit > 0;
          const isZero = shopData.profit === 0;
          
          let profitText = '';
          let rateBadge = '';
          if (isPlus) {
            profitText = `<span class="profit-line plus"><span style="font-size:0.75rem; color:#6b7280; font-weight:normal;">見込利益: </span>+¥${shopData.profit.toLocaleString()}</span>`;
            rateBadge = `<span class="rate-badge bg-plus">+${shopData.profit_rate.toFixed(1)}%</span>`;
          } else if (isZero) {
            profitText = `<span class="profit-line">¥0</span>`;
            rateBadge = `<span class="rate-badge">±0.0%</span>`;
          } else {
            profitText = `<span class="profit-line minus"><span style="font-size:0.75rem; color:#6b7280; font-weight:normal;">損失: </span>-¥${Math.abs(shopData.profit).toLocaleString()}</span>`;
            rateBadge = `<span class="rate-badge bg-minus">${shopData.profit_rate.toFixed(1)}%</span>`;
          }
            
          return `
            <div class="rank-row ${rankClasses[i] || 'rank-3'}">
              <div class="rank-left">
                <span class="rank-badge">${rankBadges[i] || (i+1) + '位'}</span>
                ${typeBadge}
                <span class="shop-name">${shopData.shop}${postBadge}</span>
              </div>
              <div class="rank-center">
                <span class="price-label">仕入:</span><span class="price-val">¥${shopData.price.toLocaleString()}</span>
              </div>
              <div class="rank-right">
                ${profitText}
                ${rateBadge}
              </div>
              <a href="${shopData.url}" target="_blank" rel="noopener noreferrer" class="btn-buy">購入へ ➔</a>
            </div>
          `;
        }).join('');

        if (isFallbackToGeneral) {
          topHtml = `<div style="font-size:0.75rem; color:#b45309; background:#fffbeb; border:1px solid #fef3c7; padding:4px 8px; border-radius:4px; margin-bottom:6px; font-weight:600;">※正規取扱店に在庫がないため、市場最安店を表示中</div>` + topHtml;
        }
      }

      rowsHtml += `
        <tr>
          <td class="item-col">
            ${nameHtml}
            ${memoHtml}
            <span class="jan">JAN: ${it.jan || '未登録'}</span>
          </td>
          <td class="price-col buy-price">${buyStr}</td>
          <td class="top3-col">
            ${topHtml}
          </td>
        </tr>
      `;

      if (idx === 2 || idx === 5) {
        rowsHtml += createInfeedRowHtml();
      }
    });

    tbody.innerHTML = rowsHtml;

    requestAnimationFrame(() => {
      document.querySelectorAll('.infeed-box ins.adsbygoogle:not([data-adsbygoogle-status])').forEach(el => {
        try {
          (adsbygoogle = window.adsbygoogle || []).push({});
        } catch(e) {}
      });
    });
  }

  ['filter-input', 'sort-select', 'official-only', 'in-stock-only', 'cat-console', 'cat-soft', 'cat-controller'].forEach(id => {
    document.getElementById(id).addEventListener('change', render);
    if(id === 'filter-input') document.getElementById(id).addEventListener('input', render);
  });

  document.querySelectorAll('input[name="rank-limit"]').forEach(r => {
    r.addEventListener('change', render);
  });

  loadData();
</script>
</body>
</html>
