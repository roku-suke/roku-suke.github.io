  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --blue: #1d68ff;
      --green: #10b981;
      --red: #ef4444;
      --rakuten-bg: #fffdf5;
      --rakuten-border: #fef08a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 40px;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: #f1f5f9;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .page-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
    }
    .badge-live {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .controls-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      font-size: 0.85rem;
    }
    .search-input {
      flex: 1 1 220px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .select-control {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fff;
    }
    .filter-item-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .filter-item-group label {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .filter-group-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      width: 100%;
      padding-top: 4px;
    }
    .btn-tab {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-sub);
    }
    .btn-tab.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .container {
      max-width: 1280px;
      margin: 12px auto;
      padding: 0 12px;
    }
    .ad-banner {
      margin: 12px auto;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
    }

    .table-header {
      display: grid;
      grid-template-columns: 2fr 1.3fr 3.5fr;
      padding: 10px 16px;
      background: #f1f5f9;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .product-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      background: #ffffff;
    }
    .product-row {
      display: grid;
      grid-template-columns: 2fr 1.3fr 3.5fr;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .product-row:last-child {
      border-bottom: none;
    }

    .col-name {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .product-name {
      font-size: 0.92rem;
      font-weight: 800;
      line-height: 1.35;
    }
    .product-name a { color: inherit; text-decoration: none; }
    .product-name a:hover { text-decoration: underline; color: var(--blue); }
    .product-meta {
      font-size: 0.72rem;
      color: var(--text-sub);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge-cat {
      background: #f1f5f9;
      color: #475569;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.68rem;
    }

    .col-price {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }
    .val-chome {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .official-info {
      font-size: 0.75rem;
      color: var(--text-sub);
    }
    .diff-plus { color: var(--green); font-weight: 700; }
    .diff-minus { color: var(--red); font-weight: 700; }

    .col-rakuten {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .rakuten-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--rakuten-bg);
      border: 1px solid var(--rakuten-border);
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .rakuten-shop-box {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 45%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-official {
      font-size: 0.68rem;
      background: #dbeafe;
      color: #1e40af;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
    }
    .badge-general {
      font-size: 0.68rem;
      background: #f1f5f9;
      color: #64748b;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 600;
    }
    .badge-postage {
      font-size: 0.68rem;
      background: #dcfce7;
      color: #15803d;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .rakuten-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rakuten-price { font-weight: 700; color: #334155; }
    .btn-buy {
      background: #b91c1c;
      color: #fff;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .table-header { display: none; }
      .product-list {
        border: none;
        background: transparent;
        gap: 12px;
      }
      .product-row {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        gap: 10px;
      }
      .col-price {
        padding-bottom: 6px;
        border-bottom: 1px dashed var(--border);
      }
      .col-price::before {
        content: "一丁目買取:";
        font-size: 0.8rem;
        color: var(--text-sub);
        font-weight: 700;
        margin-bottom: 2px;
        display: block;
      }
      .rakuten-shop-box { max-width: 40%; }
    }

    /* 共通インフィード広告スタイル */
    .infeed-ad-row {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 16px 12px;
      text-align: center;
    }
    .infeed-label {
      font-size: 0.72rem;
      color: #94a3b8;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      display: block;
    }
    .infeed-box {
      max-width: 800px;
      margin: 0 auto;
      min-height: 90px;
    }
    @media (max-width: 768px) {
      .infeed-ad-row {
        border: 1px dashed var(--border);
        border-radius: 10px;
      }
    }

    .bottom-nav {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<script src="data.js?t=1"></script>

<script>
  try {
    const firebaseConfig = { databaseURL: "https://price-tracker-presence-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const onlineRef = db.ref(".info/connected");
    const countRef = db.ref("presence/kaden_apple");
    onlineRef.on("value", (snap) => {
      if (snap.val() === true) {
        const con = countRef.push();
        con.onDisconnect().remove();
        con.set(true);
      }
    });
    countRef.on("value", (snap) => {
      document.getElementById("onlineCount").textContent = snap.numChildren() || 1;
    });
  } catch(e) {
    console.warn("Firebase offline mode");
  }

  let rawData = [];
  let currentCategory = "all";

  // ★ 共通インフィード広告生成（規約準拠 SPONSORED ラベル付与）
  function createInfeedRowHtml() {
    return `
      <div class="infeed-ad-row">
        <span class="infeed-label">― SPONSORED ―</span>
        <div class="infeed-box">
          <ins class="adsbygoogle"
               style="display:block"
               data-ad-format="fluid"
               data-ad-layout-key="-fb+5w+4e-db+86"
               data-ad-client="ca-pub-9014722014583256"
               data-ad-slot="8633264562"></ins>
        </div>
      </div>
    `;
  }

  async function loadData() {
    try {
      const res = await fetch("data.json?t=" + Date.now());
      if (!res.ok) throw new Error("JSON fetch failed");
      rawData = await res.json();
    } catch(e) {
      if (window.APPLE_DATA) rawData = window.APPLE_DATA;
    }
    render();
  }

  function filterAndSortData() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    const sortVal = document.getElementById("sortSelect").value;
    const isOfficialOnly = document.getElementById("officialOnlyCheck").checked;
    const isInStockOnly = document.getElementById("inStockOnlyCheck").checked;

    const headerTitle = document.getElementById("rakutenHeaderTitle");
    if (headerTitle) {
      headerTitle.textContent = isOfficialOnly 
        ? "Apple正規取扱店 安値TOP3（ショップ / 仕入価格 / 見込利益・損失 / リンク）" 
        : "市場全体 安値TOP3（ショップ / 仕入価格 / 見込利益・損失 / リンク）";
    }

    let filtered = rawData.filter(item => {
      // ★ カテゴリタブ判定の修復（入力機器・充電器の完全網羅）
      if (currentCategory !== "all") {
        const cat = (item.category || "").toLowerCase();
        const memo = (item.memo || "").toLowerCase();
        const name = (item.name || "").toLowerCase();
        const combined = `${cat} ${memo} ${name}`;

        if (currentCategory === "AirPods" && !combined.includes("airpods") && !combined.includes("homepod")) return false;
        if (currentCategory === "Input" && !combined.includes("pencil") && !combined.includes("mouse") && !combined.includes("trackpad") && !combined.includes("keyboard")) return false;
        if (currentCategory === "Power" && !combined.includes("充電") && !combined.includes("アダプタ") && !combined.includes("magsafe") && !combined.includes("ケーブル")) return false;
        if (currentCategory === "AirTag" && !combined.includes("airtag")) return false;
        if (currentCategory === "Apple TV" && !combined.includes("apple tv") && !combined.includes("tv 4k")) return false;
      }

      // 正規店のみON時は公式在庫を優先、完売時のみ市場最安店を参照
      let targetTop = [];
      if (isOfficialOnly) {
        targetTop = (item.official_top3 && item.official_top3.length > 0) 
          ? item.official_top3 
          : (item.all_top3 || []);
      } else {
        targetTop = item.all_top3 || [];
      }

      if (isInStockOnly && targetTop.length === 0) {
        return false;
      }

      if (query) {
        const hit = (item.name && item.name.toLowerCase().includes(query)) ||
                    (item.jan && item.jan.includes(query)) ||
                    (item.memo && item.memo.toLowerCase().includes(query)) ||
                    targetTop.some(r => r.shop.toLowerCase().includes(query));
        if (!hit) return false;
      }
      return true;
    });

    filtered.sort((a, b) => {
      const topA = isOfficialOnly 
        ? ((a.official_top3 && a.official_top3.length > 0) ? a.official_top3 : (a.all_top3 || []))
        : (a.all_top3 || []);
      const topB = isOfficialOnly 
        ? ((b.official_top3 && b.official_top3.length > 0) ? b.official_top3 : (b.all_top3 || []))
        : (b.all_top3 || []);

      if (sortVal === "official_rate_desc") {
        const rateA = a.official_price > 0 ? ((a.buy_price - a.official_price) / a.official_price * 100) : -999;
        const rateB = b.official_price > 0 ? ((b.buy_price - b.official_price) / b.official_price * 100) : -999;
        return rateB - rateA;
      } else if (sortVal === "rakuten_rate_desc") {
        const rRateA = (topA[0] && topA[0].profit_rate !== undefined) ? topA[0].profit_rate : -999;
        const rRateB = (topB[0] && topB[0].profit_rate !== undefined) ? topB[0].profit_rate : -999;
        return rRateB - rRateA;
      } else if (sortVal === "chome_desc") {
        return (b.buy_price || 0) - (a.buy_price || 0);
      } else if (sortVal === "official_diff_desc") {
        const diffA = a.official_price > 0 ? (a.buy_price - a.official_price) : -999999;
        const diffB = b.official_price > 0 ? (b.buy_price - b.official_price) : -999999;
        return diffB - diffA;
      } else if (sortVal === "rakuten_diff_desc") {
        const pA = (topA[0] && topA[0].profit !== undefined) ? topA[0].profit : -999999;
        const pB = (topB[0] && topB[0].profit !== undefined) ? topB[0].profit : -999999;
        return pB - pA;
      }
      return 0;
    });

    return filtered;
  }

  function render() {
    const listElem = document.getElementById("productList");
    const items = filterAndSortData();
    const isOfficialOnly = document.getElementById("officialOnlyCheck").checked;
    const displayCount = parseInt(document.querySelector("input[name='displayCount']:checked").value, 10);

    if (rawData.length > 0 && rawData[0].updated_at) {
      document.getElementById("lastUpdated").textContent = "最終更新: " + rawData[0].updated_at;
    }

    if (items.length === 0) {
      listElem.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-sub);">該当する商品が見つかりませんでした。</div>`;
      return;
    }

    let html = "";
    items.forEach((item, idx) => {
      // ★ 共通ルール：3件目（idx === 2）と 11件目（idx === 10）の直後に限定配置
      if (idx === 2 || idx === 10) {
        html += createInfeedRowHtml();
      }

      let officialLine = "";
      if (item.official_price > 0) {
        const diff = item.buy_price - item.official_price;
        const rate = ((diff / item.official_price) * 100).toFixed(1);
        const diffText = diff >= 0 ? `+¥${diff.toLocaleString()}` : `-¥${Math.abs(diff).toLocaleString()}`;
        const rateText = diff >= 0 ? `+${rate}%` : `${rate}%`;
        const diffClass = diff >= 0 ? "diff-plus" : "diff-minus";

        officialLine = `
          <div class="official-info">
            定価: ¥${item.official_price.toLocaleString()}<br>
            <span class="${diffClass}">${diffText} (${rateText})</span>
          </div>
        `;
      }

      let rawList = [];
      let isFallbackToGeneral = false;
      if (isOfficialOnly) {
        if (item.official_top3 && item.official_top3.length > 0) {
          rawList = item.official_top3;
        } else if (item.all_top3 && item.all_top3.length > 0) {
          rawList = item.all_top3;
          isFallbackToGeneral = true;
        }
      } else {
        rawList = item.all_top3 || [];
      }

      const topList = rawList.slice(0, displayCount);

      let rakutenHtml = "";
      if (topList.length > 0) {
        rakutenHtml = topList.map((r, rIdx) => {
          const medal = rIdx === 0 ? "🥇 1位" : rIdx === 1 ? "🥈 2位" : "🥉 3位";
          const shopTypeBadge = r.is_official 
            ? '<span class="badge-official">公式</span>' 
            : '<span class="badge-general">一般</span>';
          
          const isProfit = r.profit >= 0;
          const label = isProfit ? "見込利益:" : "損失:";
          const diffText = isProfit ? `+¥${r.profit.toLocaleString()}` : `-¥${Math.abs(r.profit).toLocaleString()}`;
          const rateText = isProfit ? `+${r.profit_rate}%` : `${r.profit_rate}%`;
          const valColor = isProfit ? "color:var(--green);" : "color:var(--red);";

          return `
            <div class="rakuten-item">
              <div class="rakuten-shop-box">
                <span style="font-weight:700;">${medal}</span>
                ${shopTypeBadge}
                <span title="${r.shop}">${r.shop}</span>
                ${r.postage_flag === 1 ? '<span class="badge-postage">無料</span>' : ''}
              </div>
              <div class="rakuten-right">
                <span class="rakuten-price">仕入: ¥${r.price.toLocaleString()}</span>
                <span style="font-size:0.75rem; font-weight:700; ${valColor}">
                  ${label} ${diffText} (${rateText})
                </span>
                <a href="${r.url}" target="_blank" rel="noopener" class="btn-buy">購入へ ➔</a>
              </div>
            </div>
          `;
        }).join("");

        if (isFallbackToGeneral) {
          rakutenHtml = `<div style="font-size:0.75rem; color:#b45309; background:#fffbeb; border:1px solid #fef3c7; padding:4px 8px; border-radius:4px; margin-bottom:6px; font-weight:600;">※正規取扱店に在庫がないため、市場最安店を表示中</div>` + rakutenHtml;
        }
      } else {
        rakutenHtml = `<div style="font-size:0.8rem; color:var(--text-sub); padding: 8px 12px;">現在、楽天市場に新品の在庫がありません。</div>`;
      }

      // ★ 仕様書厳守：カテゴリトップURLへの不正フォールバックを排除
      const directUrl = (item.chome_url && item.chome_url.startsWith('https://www.1-chome.com/wineDetail/'))
        ? item.chome_url
        : '#';

      const nameHtml = (directUrl !== '#')
        ? `<a href="${directUrl}" target="_blank" rel="noopener">${item.name} 🔗</a>`
        : `<span>${item.name}</span>`;

      html += `
        <div class="product-row">
          <div class="col-name">
            <div class="product-name">
              ${nameHtml}
              <span class="badge-cat">${item.category || 'Apple'}</span>
            </div>
            <div class="product-meta">
              <span>JAN: ${item.jan || '未登録'}</span>
            </div>
          </div>
          <div class="col-price">
            <div class="val-chome">¥${(item.buy_price || 0).toLocaleString()}</div>
            ${officialLine}
          </div>
          <div class="col-rakuten">
            ${rakutenHtml}
          </div>
        </div>
      `;
    });

    listElem.innerHTML = html;

    // ★ 未描画広告のみを対象に安全初期化（多重呼び出しエラーを防止）
    requestAnimationFrame(() => {
      document.querySelectorAll('.infeed-box ins.adsbygoogle:not([data-adsbygoogle-status])').forEach(el => {
        try {
          (adsbygoogle = window.adsbygoogle || []).push({});
        } catch(e) {}
      });
    });
  }

  document.getElementById("searchInput").addEventListener("input", render);
  document.getElementById("sortSelect").addEventListener("change", render);
  document.getElementById("officialOnlyCheck").addEventListener("change", render);
  document.getElementById("inStockOnlyCheck").addEventListener("change", render);

  document.querySelectorAll("input[name='displayCount']").forEach(radio => {
    radio.addEventListener("change", render);
  });

  document.querySelectorAll(".btn-tab[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".btn-tab[data-cat]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = btn.dataset.cat;
      render();
    });
  });

  loadData();
</script>

</body>
</html>
