<script>
  // ★【デュアルSticky高さ連動・ゼロ値汚染ガード】
  function updateStickyPositions() {
    const controls = document.getElementById("controls-container");
    if (controls) {
      const h = controls.offsetHeight;
      if (h > 0) {
        document.documentElement.style.setProperty("--controls-height", h + "px");
      }
    }
  }

  window.addEventListener("resize", updateStickyPositions);
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(updateStickyPositions);
    const target = document.getElementById("controls-container");
    if (target) ro.observe(target);
  }

  // ★【バグ修正①】本番Firebase設定（iphone-tracker-2db9e）に完全統一
  const firebaseConfig = {
    apiKey: "AIzaSyDouxwWQCgn-4Sq6wA503XzbPh3FG_MrOo",
    authDomain: "iphone-tracker-2db9e.firebaseapp.com",
    databaseURL: "https://iphone-tracker-2db9e-default-rtdb.firebaseio.com",
    projectId: "iphone-tracker-2db9e",
    storageBucket: "iphone-tracker-2db9e.firebasestorage.app",
    messagingSenderId: "138170739435",
    appId: "1:138170739435:web:d08a229acf17b129452cae"
  };

  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const countRef = db.ref("presence/kaden_apple");
    const userRef = countRef.push();

    db.ref(".info/connected").on("value", (snap) => {
      if (snap.val() === true) {
        userRef.onDisconnect().remove();
        userRef.set(true);
      }
    });
    countRef.on("value", (snap) => {
      const count = snap.numChildren();
      const el = document.getElementById("onlineCount");
      if (el) el.textContent = count > 0 ? count : 1;
    });
  } catch(e) {
    console.warn("Firebase offline mode");
  }

  let rawData = [];
  let currentCategory = "all";

  // 【仕様書 3.①-1 準拠】Debounce 関数 (300ms)
  function debounce(func, wait) {
    let timeout;
    return function() {
      const context = this, args = arguments;
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(context, args), wait);
    };
  }

  function createInfeedRowHtml() {
    return `
      <div class="infeed-ad-row">
        <span class="infeed-label">― SPONSORED ―</span>
        <div class="infeed-box">
          <ins class="adsbygoogle"
               style="display:block"
               data-ad-client="ca-pub-9014722014583256"
               data-ad-slot="8633264562"
               data-ad-format="auto"
               data-full-width-responsive="true"></ins>
        </div>
      </div>
    `;
  }

  function reloadLocalScript() {
    return new Promise((resolve) => {
      const oldScript = document.getElementById("scraped-data-script");
      if (oldScript) oldScript.remove();

      const newScript = document.createElement("script");
      newScript.id = "scraped-data-script";
      newScript.src = "./data.js?t=" + Date.now();
      newScript.onload = () => {
        if (window.APPLE_DATA && Array.isArray(window.APPLE_DATA) && window.APPLE_DATA.length > 0) {
          rawData = window.APPLE_DATA;
        }
        resolve(true);
      };
      newScript.onerror = () => resolve(false);
      document.head.appendChild(newScript);
    });
  }

  // 【SWR即時描画 ＆ 二重フォールバック保護】
  async function loadData() {
    // プリロード済みデータが存在すれば、待たずに0秒で即時描画（チラつき完全根絶）
    if (window.APPLE_DATA && Array.isArray(window.APPLE_DATA) && window.APPLE_DATA.length > 0 && rawData.length === 0) {
      rawData = window.APPLE_DATA;
      render();
    }

    // バックグラウンドで最新JS/JSONを再検証
    await reloadLocalScript();

    try {
      const res = await fetch("./data.json?t=" + Date.now());
      if (res.ok) {
        const jsonData = await res.json();
        if (jsonData && Array.isArray(jsonData) && jsonData.length > 0) {
          rawData = jsonData;
        }
      }
    } catch(e) {}

    render();
  }

  function filterAndSortData() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    const sortVal = document.getElementById("sortSelect").value;
    const isOfficialOnly = document.getElementById("officialOnlyCheck").checked;
    const isInStockOnly = document.getElementById("inStockOnlyCheck").checked;

    const headerTitle = document.getElementById("rakutenHeaderTitle");
    if (headerTitle) {
      headerTitle.textContent = isOfficialOnly 
        ? "Apple正規取扱店 安値TOP3（ショップ / 仕入価格 / 見込利益・損失 / リンク）" 
        : "市場全体 安値TOP3（ショップ / 仕入価格 / 見込利益・損失 / リンク）";
    }

    let filtered = rawData.filter(item => {
      // 【バグ修正③】カテゴリ判定の誤爆防止（分類済みタグを最優先信頼）
      if (currentCategory !== "all") {
        if (item.category) {
          if (item.category !== currentCategory) return false;
        } else {
          const combined = `${item.memo || ""} ${item.name || ""}`.toLowerCase();
          if (currentCategory === "AirPods・音響" && !combined.includes("airpods") && !combined.includes("homepod")) return false;
          if (currentCategory === "Pencil・入力" && !combined.includes("pencil") && !combined.includes("mouse") && !combined.includes("trackpad") && !combined.includes("keyboard")) return false;
          if (currentCategory === "充電・アダプタ" && !combined.includes("充電") && !combined.includes("アダプタ") && !combined.includes("magsafe") && !combined.includes("ケーブル")) return false;
          if (currentCategory === "AirTag" && !combined.includes("airtag")) return false;
          if (currentCategory === "Apple TV" && !combined.includes("apple tv") && !combined.includes("tv 4k")) return false;
        }
      }

      let targetTop = [];
      if (isOfficialOnly) {
        targetTop = (item.official_top3 && item.official_top3.length > 0) 
          ? item.official_top3 
          : (item.all_top3 || []);
      } else {
        targetTop = item.all_top3 || [];
      }

      if (isInStockOnly && targetTop.length === 0) {
        return false;
      }

      if (query) {
        const hit = (item.name && item.name.toLowerCase().includes(query)) ||
                    (item.jan && item.jan.includes(query)) ||
                    (item.memo && item.memo.toLowerCase().includes(query)) ||
                    targetTop.some(r => r.shop && r.shop.toLowerCase().includes(query));
        if (!hit) return false;
      }
      return true;
    });

    // 【仕様書 3.①-2 ＆ バグ修正②】NaN防止型安全ソート（在庫なし商品を確実に最背面へ）
    filtered.sort((a, b) => {
      const topA = isOfficialOnly 
        ? ((a.official_top3 && a.official_top3.length > 0) ? a.official_top3 : (a.all_top3 || []))
        : (a.all_top3 || []);
      const topB = isOfficialOnly 
        ? ((b.official_top3 && b.official_top3.length > 0) ? b.official_top3 : (b.all_top3 || []))
        : (b.all_top3 || []);

      const buyA = a.buy_price || 0;
      const buyB = b.buy_price || 0;

      if (sortVal === "official_rate_desc") {
        const hasA = a.official_price > 0 && buyA > 0;
        const hasB = b.official_price > 0 && buyB > 0;
        if (!hasA && !hasB) return 0;
        if (!hasA) return 1;
        if (!hasB) return -1;
        const rateA = (buyA - a.official_price) / a.official_price * 100;
        const rateB = (buyB - b.official_price) / b.official_price * 100;
        return rateB - rateA;
      } else if (sortVal === "rakuten_rate_desc") {
        const hasA = topA.length > 0 && typeof topA[0].profit_rate === 'number';
        const hasB = topB.length > 0 && typeof topB[0].profit_rate === 'number';
        if (!hasA && !hasB) return 0;
        if (!hasA) return 1;
        if (!hasB) return -1;
        return topB[0].profit_rate - topA[0].profit_rate;
      } else if (sortVal === "chome_desc") {
        return buyB - buyA;
      } else if (sortVal === "official_diff_desc") {
        const hasA = a.official_price > 0 && buyA > 0;
        const hasB = b.official_price > 0 && buyB > 0;
        if (!hasA && !hasB) return 0;
        if (!hasA) return 1;
        if (!hasB) return -1;
        const diffA = buyA - a.official_price;
        const diffB = buyB - b.official_price;
        return diffB - diffA;
      } else if (sortVal === "rakuten_diff_desc") {
        const hasA = topA.length > 0 && typeof topA[0].profit === 'number';
        const hasB = topB.length > 0 && typeof topB[0].profit === 'number';
        if (!hasA && !hasB) return 0;
        if (!hasA) return 1;
        if (!hasB) return -1;
        return topB[0].profit - topA[0].profit;
      }
      return 0;
    });

    return filtered;
  }

  function render() {
    const listElem = document.getElementById("productList");
    const items = filterAndSortData();
    const isOfficialOnly = document.getElementById("officialOnlyCheck").checked;
    const displayCount = parseInt(document.querySelector("input[name='displayCount']:checked").value, 10);

    if (rawData.length > 0 && rawData[0].updated_at) {
      document.getElementById("lastUpdated").textContent = "最終更新: " + rawData[0].updated_at;
    }

    if (items.length === 0) {
      listElem.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-sub);">該当する商品が見つかりませんでした。</div>`;
      return;
    }

    let html = "";
    items.forEach((item, idx) => {
      // インフィード広告（3件目・11件目直後）
      if (idx === 2 || idx === 10) {
        html += createInfeedRowHtml();
      }

      let officialLine = "";
      if (item.official_price > 0) {
        const diff = (item.buy_price || 0) - item.official_price;
        const rate = ((diff / item.official_price) * 100).toFixed(1);
        const diffText = diff > 0 ? `+¥${diff.toLocaleString()}` : (diff < 0 ? `-¥${Math.abs(diff).toLocaleString()}` : "¥0");
        const rateText = diff > 0 ? `+${rate}%` : `${rate}%`;
        const diffClass = diff > 0 ? "diff-plus" : (diff < 0 ? "diff-minus" : "");

        officialLine = `
          <div class="official-info">
            定価: ¥${item.official_price.toLocaleString()}<br>
            <span class="${diffClass}">${diffText} (${rateText})</span>
          </div>
        `;
      }

      let rawList = [];
      let isFallbackToGeneral = false;
      if (isOfficialOnly) {
        if (item.official_top3 && item.official_top3.length > 0) {
          rawList = item.official_top3;
        } else if (item.all_top3 && item.all_top3.length > 0) {
          rawList = item.all_top3;
          isFallbackToGeneral = true;
        }
      } else {
        rawList = item.all_top3 || [];
      }

      const topList = rawList.slice(0, displayCount);

      let rakutenHtml = "";
      if (topList.length > 0) {
        rakutenHtml = topList.map((r, rIdx) => {
          const medal = rIdx === 0 ? "🥇 1位" : rIdx === 1 ? "🥈 2位" : "🥉 3位";
          const shopTypeBadge = r.is_official 
            ? '<span class="badge-official">公式</span>' 
            : '<span class="badge-general">一般</span>';
          
          // 【バグ修正④】利益0円時の自然な中立表示
          let label = "見込利益:";
          let diffText = `+¥${(r.profit || 0).toLocaleString()}`;
          let rateText = `+${r.profit_rate}%`;
          let valColor = "color:var(--green);";

          if (r.profit === 0) {
            label = "差額:";
            diffText = "¥0";
            rateText = "±0.0%";
            valColor = "color:var(--text-sub);";
          } else if (r.profit < 0) {
            label = "損失:";
            diffText = `-¥${Math.abs(r.profit).toLocaleString()}`;
            rateText = `${r.profit_rate}%`;
            valColor = "color:var(--red);";
          }

          const buyBtn = (r.url && r.url.startsWith("http"))
            ? `<a href="${r.url}" target="_blank" rel="noopener noreferrer" class="btn-buy">購入へ ➔</a>`
            : "";

          return `
            <div class="rakuten-item">
              <div class="rakuten-shop-box">
                <span style="font-weight:700;">${medal}</span>
                ${shopTypeBadge}
                <span title="${r.shop}">${r.shop}</span>
                ${r.postage_flag === 1 ? '<span class="badge-postage">無料</span>' : ''}
              </div>
              <div class="rakuten-right">
                <span class="rakuten-price">仕入: ¥${(r.price || 0).toLocaleString()}</span>
                <span style="font-size:0.75rem; font-weight:700; ${valColor}">
                  ${label} ${diffText} (${rateText})
                </span>
                ${buyBtn}
              </div>
            </div>
          `;
        }).join("");

        if (isFallbackToGeneral) {
          rakutenHtml = `<div style="font-size:0.75rem; color:#b45309; background:#fffbeb; border:1px solid #fef3c7; padding:4px 8px; border-radius:4px; margin-bottom:6px; font-weight:600;">※正規取扱店に在庫がないため、市場最安店を表示中</div>` + rakutenHtml;
        }
      } else {
        rakutenHtml = `<div style="font-size:0.8rem; color:var(--text-sub); padding: 8px 12px;">現在、楽天市場に新品の在庫がありません。</div>`;
      }

      // ダミーリンク（href="#"）の完全排除
      const directUrl = (item.chome_url && item.chome_url.startsWith("https://www.1-chome.com/wineDetail/"))
        ? item.chome_url
        : null;

      const nameHtml = directUrl
        ? `<a href="${directUrl}" target="_blank" rel="noopener noreferrer">${item.name} 🔗</a>`
        : `<span>${item.name}</span>`;

      html += `
        <div class="product-row">
          <div class="col-name">
            <div class="product-name">
              ${nameHtml}
              <span class="badge-cat">${item.category || 'Apple'}</span>
            </div>
            <div class="product-meta">
              <span>JAN: ${item.jan || '未登録'}</span>
            </div>
          </div>
          <div class="col-price">
            <div class="val-chome">¥${(item.buy_price || 0).toLocaleString()}</div>
            ${officialLine}
          </div>
          <div class="col-rakuten">
            ${rakutenHtml}
          </div>
        </div>
      `;
    });

    listElem.innerHTML = html;
    updateStickyPositions();

    // 未処理のインフィード広告のみを安全初期化
    requestAnimationFrame(() => {
      document.querySelectorAll(".infeed-box ins.adsbygoogle:not([data-adsbygoogle-status])").forEach(el => {
        try {
          (adsbygoogle = window.adsbygoogle || []).push({});
        } catch(e) {}
      });
    });
  }

  // イベントリスナー（検索は300msのDebounceを適用）
  document.getElementById("searchInput").addEventListener("input", debounce(render, 300));
  document.getElementById("sortSelect").addEventListener("change", render);
  document.getElementById("officialOnlyCheck").addEventListener("change", render);
  document.getElementById("inStockOnlyCheck").addEventListener("change", render);

  document.querySelectorAll("input[name='displayCount']").forEach(radio => {
    radio.addEventListener("change", render);
  });

  document.querySelectorAll(".btn-tab[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".btn-tab[data-cat]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = btn.dataset.cat;
      render();
    });
  });

  // 初期ロード実行 ＆ 【バグ修正⑤】5分ごとの定期自動更新・タブ復帰更新の完備
  updateStickyPositions();
  loadData();
  setInterval(loadData, 300000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') loadData();
  });
</script>

</body>
</html>
