<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apple製品 買取価格・相場比較</title>
  <meta name="description" content="AirPods・Apple Pencil・AirTagなどの買取一丁目価格、Apple公式定価・楽天市場との損益率・差額をリアルタイム比較。">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9X38Q03YBN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9X38Q03YBN');
  </script>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9014722014583256" crossorigin="anonymous"></script>

  <!-- Firebase (閲覧人数リアルタイム表示) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --blue: #1d68ff;
      --green: #10b981;
      --red: #ef4444;
      --rakuten-bg: #fffdf5;
      --rakuten-border: #fef08a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 40px;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: #f1f5f9;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .page-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
    }
    .badge-live {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .controls-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 8px 16px 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border-top: 1px solid #f1f5f9;
    }
    .search-input {
      flex: 1 1 200px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .select-control {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      background: #fff;
    }
    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-tab {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-sub);
    }
    .btn-tab.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .container {
      max-width: 1280px;
      margin: 12px auto;
      padding: 0 12px;
    }
    .ad-banner {
      margin: 12px auto;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
    }

    .table-header {
      display: grid;
      grid-template-columns: 2fr 1.3fr 3.5fr;
      padding: 10px 16px;
      background: #f1f5f9;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .product-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      background: #ffffff;
    }
    .product-row {
      display: grid;
      grid-template-columns: 2fr 1.3fr 3.5fr;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .product-row:last-child {
      border-bottom: none;
    }

    .col-name {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .product-name {
      font-size: 0.92rem;
      font-weight: 800;
      line-height: 1.35;
    }
    .product-name a { color: inherit; text-decoration: none; }
    .product-name a:hover { text-decoration: underline; color: var(--blue); }
    .product-meta {
      font-size: 0.72rem;
      color: var(--text-sub);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge-cat {
      background: #f1f5f9;
      color: #475569;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.68rem;
    }

    .col-price {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }
    .val-chome {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .official-info {
      font-size: 0.75rem;
      color: var(--text-sub);
    }
    .diff-plus { color: var(--green); font-weight: 700; }
    .diff-minus { color: var(--red); font-weight: 700; }

    .col-rakuten {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .rakuten-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--rakuten-bg);
      border: 1px solid var(--rakuten-border);
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .rakuten-shop-box {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 45%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-official {
      font-size: 0.68rem;
      background: #dbeafe;
      color: #1e40af;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
    }
    .badge-general {
      font-size: 0.68rem;
      background: #f1f5f9;
      color: #64748b;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 600;
    }
    .badge-postage {
      font-size: 0.68rem;
      background: #dcfce7;
      color: #15803d;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .rakuten-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rakuten-price { font-weight: 700; color: #334155; }
    .btn-buy {
      background: #b91c1c;
      color: #fff;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .table-header { display: none; }
      .product-list {
        border: none;
        background: transparent;
        gap: 12px;
      }
      .product-row {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        gap: 10px;
      }
      .col-price {
        padding-bottom: 6px;
        border-bottom: 1px dashed var(--border);
      }
      .rakuten-shop-box { max-width: 40%; }
    }

    .infeed-ad-row {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      text-align: center;
    }
    @media (max-width: 768px) {
      .infeed-ad-row {
        border: 1px dashed var(--border);
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-left">
      <a href="../../index.html" class="btn-back">⬅ ポータル</a>
      <div class="page-title">
        <span>🍎 Apple製品 買取・相場比較</span>
      </div>
    </div>
    <div class="header-right">
      <div class="badge-live"><span class="live-dot"></span>閲覧中: <span id="onlineCount">1</span>人</div>
      <div id="lastUpdated" style="color:var(--text-sub);">更新中...</div>
    </div>
  </div>

  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="モデル名・型番・JANで検索...">
    
    <select id="sortSelect" class="select-control">
      <option value="official_rate_desc">🍎 Apple公式 損益率が良い順</option>
      <option value="rakuten_rate_desc">🛒 楽天 損益率が良い順</option>
      <option value="chome_desc">一丁目 買取価格が高い順</option>
      <option value="official_diff_desc">Apple公式 差額が大きい順</option>
      <option value="rakuten_diff_desc">楽天 利益額が大きい順</option>
    </select>

    <div class="filter-group">
      <button class="btn-tab active" data-cat="all">すべて</button>
      <button class="btn-tab" data-cat="AirPods">AirPods / 音響</button>
      <button class="btn-tab" data-cat="Pencil">Pencil / 入力</button>
      <button class="btn-tab" data-cat="充電">充電・アダプタ</button>
      <button class="btn-tab" data-cat="AirTag">AirTag</button>
      <button class="btn-tab" data-cat="Apple TV">Apple TV</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="ad-banner">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9014722014583256"
         data-ad-slot="7138671333"
         data-ad-format="horizontal"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <div class="table-header">
    <div>商品名（一丁目リンク）/ 仕様・メモ</div>
    <div>買取価格 / Apple公式比較</div>
    <div>楽天市場 安値TOP3（ショップ / 仕入価格 / 見込利益・損失 / リンク）</div>
  </div>

  <div id="productList" class="product-list">
    <div style="text-align:center; padding: 40px; color: var(--text-sub);">最新データを読み込み中...</div>
  </div>

  <div class="ad-banner">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9014722014583256"
         data-ad-slot="8633264562"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>
</div>

<script src="data.js?t=1"></script>

<script>
  try {
    const firebaseConfig = { databaseURL: "https://price-tracker-presence-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const onlineRef = db.ref(".info/connected");
    const countRef = db.ref("presence/kaden_apple");
    onlineRef.on("value", (snap) => {
      if (snap.val() === true) {
        const con = countRef.push();
        con.onDisconnect().remove();
        con.set(true);
      }
    });
    countRef.on("value", (snap) => {
      document.getElementById("onlineCount").textContent = snap.numChildren() || 1;
    });
  } catch(e) {
    console.warn("Firebase offline mode");
  }

  let rawData = [];
  let currentCategory = "all";

  function createInfeedRowHtml() {
    return `
      <div class="infeed-ad-row">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="fluid"
             data-ad-layout-key="-fb+5w+4e-db+86"
             data-ad-client="ca-pub-9014722014583256"
             data-ad-slot="8633264562"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
      </div>
    `;
  }

  async function loadData() {
    try {
      const res = await fetch("data.json?t=" + Date.now());
      if (!res.ok) throw new Error("JSON fetch failed");
      rawData = await res.json();
    } catch(e) {
      if (window.APPLE_DATA) rawData = window.APPLE_DATA;
    }
    render();
  }

  function filterAndSortData() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    const sortVal = document.getElementById("sortSelect").value;

    let filtered = rawData.filter(item => {
      if (currentCategory !== "all") {
        const cat = item.category || "";
        const memo = item.memo || "";
        if (!cat.includes(currentCategory) && !memo.includes(currentCategory)) {
          return false;
        }
      }

      if (query) {
        const hit = (item.name && item.name.toLowerCase().includes(query)) ||
                    (item.jan && item.jan.includes(query)) ||
                    (item.memo && item.memo.toLowerCase().includes(query)) ||
                    (item.all_top3 && item.all_top3.some(r => r.shop.toLowerCase().includes(query)));
        if (!hit) return false;
      }
      return true;
    });

    filtered.sort((a, b) => {
      const rateA = a.official_price > 0 ? ((a.buy_price - a.official_price) / a.official_price * 100) : -999;
      const rateB = b.official_price > 0 ? ((b.buy_price - b.official_price) / b.official_price * 100) : -999;

      const rRateA = (a.all_top3 && a.all_top3[0] && a.all_top3[0].profit_rate !== undefined) ? a.all_top3[0].profit_rate : -999;
      const rRateB = (b.all_top3 && b.all_top3[0] && b.all_top3[0].profit_rate !== undefined) ? b.all_top3[0].profit_rate : -999;

      if (sortVal === "official_rate_desc") {
        return rateB - rateA;
      } else if (sortVal === "rakuten_rate_desc") {
        return rRateB - rRateA;
      } else if (sortVal === "chome_desc") {
        return b.buy_price - a.buy_price;
      } else if (sortVal === "official_diff_desc") {
        const diffA = a.official_price > 0 ? (a.buy_price - a.official_price) : -999999;
        const diffB = b.official_price > 0 ? (b.buy_price - b.official_price) : -999999;
        return diffB - diffA;
      } else if (sortVal === "rakuten_diff_desc") {
        const pA = (a.all_top3 && a.all_top3[0]) ? a.all_top3[0].profit : -999999;
        const pB = (b.all_top3 && b.all_top3[0]) ? b.all_top3[0].profit : -999999;
        return pB - pA;
      }
      return 0;
    });

    return filtered;
  }

  function render() {
    const listElem = document.getElementById("productList");
    const items = filterAndSortData();

    if (rawData.length > 0 && rawData[0].updated_at) {
      document.getElementById("lastUpdated").textContent = "最終更新: " + rawData[0].updated_at;
    }

    if (items.length === 0) {
      listElem.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-sub);">該当する商品が見つかりませんでした。</div>`;
      return;
    }

    let html = "";
    items.forEach((item, idx) => {
      if (idx === 2 || idx === 5) {
        html += createInfeedRowHtml();
      }

      let officialLine = "";
      if (item.official_price > 0) {
        const diff = item.buy_price - item.official_price;
        const rate = ((diff / item.official_price) * 100).toFixed(1);
        const diffText = diff >= 0 ? `+¥${diff.toLocaleString()}` : `-¥${Math.abs(diff).toLocaleString()}`;
        const rateText = diff >= 0 ? `+${rate}\%` : `${rate}%`;
        const diffClass = diff >= 0 ? "diff-plus" : "diff-minus";

        officialLine = `
          <div class="official-info">
            定価: ¥${item.official_price.toLocaleString()}<br>
            <span class="${diffClass}">${diffText} (${rateText})</span>
          </div>
        `;
      }

      // 楽天市場TOP3（公式在庫があれば優先、無ければ市場最安店を表示）
      let rakutenHtml = "";
      const rawList = (item.official_top3 && item.official_top3.length > 0) 
        ? item.official_top3 
        : (item.all_top3 || []);

      if (rawList.length > 0) {
        rakutenHtml = rawList.slice(0, 3).map((r, rIdx) => {
          const medal = rIdx === 0 ? "🥇 1位" : rIdx === 1 ? "🥈 2位" : "🥉 3位";
          const shopTypeBadge = r.is_official 
            ? '<span class="badge-official">公式</span>' 
            : '<span class="badge-general">一般</span>';
          
          const isProfit = r.profit >= 0;
          const label = isProfit ? "見込利益:" : "損失:";
          const diffText = isProfit ? `+¥${r.profit.toLocaleString()}` : `-¥${Math.abs(r.profit).toLocaleString()}`;
          const rateText = isProfit ? `+${r.profit_rate}\%` : `${r.profit_rate}%`;
          const valColor = isProfit ? "color:var(--green);" : "color:var(--red);";

          return `
            <div class="rakuten-item">
              <div class="rakuten-shop-box">
                <span style="font-weight:700;">${medal}</span>${shopTypeBadge}
                <span title="${r.shop}">${r.shop}</span>${r.postage_flag === 1 ? '<span class="badge-postage">無料</span>' : ''}
              </div>
              <div class="rakuten-right">
                <span class="rakuten-price">仕入: ¥${r.price.toLocaleString()}</span>
                <span style="font-size:0.75rem; font-weight:700; ${valColor}">
                  ${label} ${diffText} (${rateText})
                </span>
                <a href="${r.url}" target="_blank" rel="noopener" class="btn-buy">購入へ ➔</a>
              </div>
            </div>
          `;
        }).join("");
      } else {
        rakutenHtml = `<div style="font-size:0.8rem; color:var(--text-sub); padding: 8px 12px;">現在、楽天市場に新品の在庫がありません。</div>`;
      }

      const directUrl = (item.chome_url && item.chome_url.startsWith('https://www.1-chome.com/wineDetail/'))
        ? item.chome_url
        : `https://www.1-chome.com/electricAppliance?category=20748358`;

      html += `
        <div class="product-row">
          <div class="col-name">
            <div class="product-name">
              <a href="${directUrl}" target="_blank" rel="noopener">${item.name} 🔗</a>
              <span class="badge-cat">${item.category || 'Apple'}</span>
            </div>
            <div class="product-meta">
              <span>JAN: ${item.jan || '未登録'}</span>
            </div>
          </div>
          <div class="col-price">
            <div class="val-chome">¥${item.buy_price.toLocaleString()}</div>${officialLine}
          </div>
          <div class="col-rakuten">
            ${rakutenHtml}
          </div>
        </div>
      `;
    });

    listElem.innerHTML = html;
  }

  document.getElementById("searchInput").addEventListener("input", render);
  document.getElementById("sortSelect").addEventListener("change", render);

  document.querySelectorAll(".btn-tab[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".btn-tab[data-cat]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = btn.dataset.cat;
      render();
    });
  });

  loadData();
</script>

</body>
</html>
