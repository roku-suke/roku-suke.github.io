name: Hourly iPhone Price Scraper

on:
  schedule:
    # 毎時18分（1時間ごと）に自動実行
    - cron: '18 * * * *'
  workflow_dispatch: # 管理画面から手動実行ボタンを押せるようにする設定

permissions:
  contents: write # 更新データをリポジトリに保存する権限

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          pip install requests beautifulsoup4

      - name: スクレイピング実行
        run: |
          python all_scraper.py

      - name: 更新データをコミット＆保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all_prices.json all_prices.js price_history.json check_log.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update price data [skip ci]" && git push)
