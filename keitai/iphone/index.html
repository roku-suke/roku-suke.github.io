  <style>
    :root {

      --bg: #f4f6f9;

      --text: #1e293b;

      --th1-height: 34px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

    }

    .info-bar {

      align-items: center;

      border: 1px solid #bfdbfe;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      color: #1e40af;
      font-weight: 500;
    }

    .online-badge {

      align-items: center;
      gap: 5px;
      background: #ecfdf5;
      color: #065f46;

    .online-dot {

    .refresh-btn {
      background: #ffffff;

    /* ★ 画面最上部に吸着固定するタブバー (top: 0) */
    .tab-bar-container {
      position: sticky;

      background: var(--bg);
      padding-top: 4px;

    .tab-bar {

    th a { color: inherit !important; text-decoration: none !important; }

    /* スマホカードビュー */

    .m-shop-name { font-size: 0.7rem; color: var(--text-sub); display: block; }
  </style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script>
  // 【AdSense安全再初期化】タブ切り替えやデータ更新時の白抜け防止
  function renderAds() {
    requestAnimationFrame(() => {
      document.querySelectorAll('.adsbygoogle:not([data-adsbygoogle-status])').forEach(el => {
        try {
          (adsbygoogle = window.adsbygoogle || []).push({});
        } catch (e) {}
      });
    });
  }

  // ★【デュアルSticky高さ連動・ゼロ値汚染ガード】
  function updateStickyPositions() {
    const tabBar = document.getElementById('tab-bar-container');
    const th1Cell = document.querySelector('#th-row-1 th.shop-th');
    if (tabBar) {
      const barH = tabBar.offsetHeight;
      if (barH > 0) {
        document.documentElement.style.setProperty('--controls-height', barH + 'px');
      }
      if (th1Cell && th1Cell.offsetHeight > 0) {
        document.documentElement.style.setProperty('--th1-height', th1Cell.offsetHeight + 'px');
      }
    }
  }

  window.addEventListener('resize', updateStickyPositions);
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(updateStickyPositions);
    const target = document.getElementById('tab-bar-container');
    if (target) ro.observe(target);
    const th1Cell = document.querySelector('#th-row-1 th.shop-th');
    if (th1Cell) ro.observe(th1Cell);
  }

  const firebaseConfig = {
    apiKey: "AIzaSyDouxwWQCgn-4Sq6wA503XzbPh3FG_MrOo",
    authDomain: "iphone-tracker-2db9e.firebaseapp.com",
    databaseURL: "https://iphone-tracker-2db9e-default-rtdb.firebaseio.com",
    projectId: "iphone-tracker-2db9e",
    storageBucket: "iphone-tracker-2db9e.firebasestorage.app",
    messagingSenderId: "138170739435",
    appId: "1:138170739435:web:d08a229acf17b129452cae"
  };

  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const presenceRef = db.ref("online_users");
    const userRef = presenceRef.push();

    db.ref(".info/connected").on("value", (snap) => {
      if (snap.val() === true) {
        userRef.onDisconnect().remove();
        userRef.set(true);
      }
    });

    presenceRef.on("value", (snap) => {
      const count = snap.numChildren();
      const el = document.getElementById("online-count");
      if (el) el.textContent = count > 0 ? count : 1;
    });
  } catch (err) {}

  let currentSeries = '18promax';
  let cachedData = null;

  function getTrendClass(trend) {
    if (!trend || trend === '-') return 'trend-none';
    if (trend.includes('↑')) return 'trend-up';
    if (trend.includes('↓')) return 'trend-down';
    return 'trend-flat';
  }

  function switchSeries(seriesKey, btn) {
    currentSeries = seriesKey;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCurrentSeries();
  }

  function renderCurrentSeries() {
    if (!cachedData) return;
    const models = (cachedData.series && cachedData.series[currentSeries]) ? cachedData.series[currentSeries] : [];
    renderPcTable(models);
    renderMobileCards(models);
    requestAnimationFrame(updateStickyPositions);
  }

  // ★【パフォーマンス最適化・DOM再構築バグ解消】一括文字列結合による高速描画
  function renderPcTable(models) {
    const tbody = document.getElementById('pc-table-body');

    if (!models || models.length === 0) {
      tbody.innerHTML = '<tr><td colspan="14" style="text-align:center; padding:20px; color:#64748b;">データがありません</td></tr>';
      return;
    }

    let fullHtml = '';
    models.forEach(item => {
      const hasValidListPrice = item.listPrice > 0;
      const rowSpan = item.colors.length;

      item.colors.forEach((c, idx) => {
        let trHtml = '<tr>';

        if (idx === 0) {
          const listPriceStr = hasValidListPrice ? '¥' + item.listPrice.toLocaleString() : '-';
          trHtml += `<td class="model-header" rowspan="${rowSpan}">${item.model}</td>`;
          trHtml += `<td class="price-cell" style="font-weight:600;" rowspan="${rowSpan}">${listPriceStr}</td>`;
        }

        trHtml += `<td style="text-align:center;"><span class="color-badge c-${c.name}">${c.name}</span></td>`;

        const shopPrices = [c.chome, c.ichiban, c.rakuen, c.rudeya, c.mobilemix, c.mobaste];
        const validPrices = shopPrices.filter(p => typeof p === 'number');
        const maxPrice = validPrices.length ? Math.max(...validPrices) : 0;

        const makeShopTd = (p, s) => {
          if (typeof p === 'number') {
            const isBest = p === maxPrice ? 'best-price' : '';
            const sClass = s === 'up' ? 'shift-up' : (s === 'down' ? 'shift-down' : 'shift-none');
            return `<td class="price-cell"><span class="${isBest} ${sClass}">¥${p.toLocaleString()}</span></td>`;
          }
          return `<td class="price-cell"><span style="color:#94a3b8;">-</span></td>`;
        };

        trHtml += makeShopTd(c.chome, c.cShift);
        trHtml += makeShopTd(c.ichiban, c.iShift);
        trHtml += makeShopTd(c.rakuen, c.rShift);
        trHtml += makeShopTd(c.rudeya, c.uShift || '');
        trHtml += makeShopTd(c.mobilemix, c.mShift);
        trHtml += makeShopTd(c.mobaste, c.sShift);

        const hasCalculation = (maxPrice > 0 && hasValidListPrice);
        const diff = hasCalculation ? maxPrice - item.listPrice : 0;
        const rate = hasCalculation ? (diff / item.listPrice) * 100 : 0;
        
        let pClass = '';
        let sign = '';
        if (hasCalculation) {
          if (diff > 0) {
            pClass = 'profit-plus';
            sign = '+';
          } else if (diff < 0) {
            pClass = 'profit-minus';
          }
        }

        const loss50k = hasCalculation ? `${sign}¥${Math.round((diff / item.listPrice) * 50000).toLocaleString()}` : '-';

        trHtml += `
          <td class="best-cell">${maxPrice > 0 ? '¥' + maxPrice.toLocaleString() : '-'}</td>
          <td class="price-cell ${pClass}">${hasCalculation ? `${sign}¥${diff.toLocaleString()}` : '-'}</td>
          <td class="price-cell ${pClass}">${hasCalculation ? `${sign}${rate.toFixed(2)}%` : '-'}</td>
          <td class="price-cell ${pClass}">${loss50k}</td>
          <td style="text-align:center;"><span class="${getTrendClass(c.trend)}">${c.trend || '-'}</span></td>
        </tr>`;

        fullHtml += trHtml;
      });
    });

    tbody.innerHTML = fullHtml;
  }

  function renderMobileCards(models) {
    const container = document.getElementById('mobile-card-body');

    if (!models || models.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">データがありません</div>';
      return;
    }

    let fullCardsHtml = '';
    models.forEach(item => {
      let overallMax = 0;
      item.colors.forEach(c => {
        const pList = [c.chome, c.ichiban, c.rakuen, c.rudeya, c.mobilemix, c.mobaste].filter(p => typeof p === 'number');
        if (pList.length) overallMax = Math.max(overallMax, ...pList);
      });

      const hasValidListPrice = item.listPrice > 0;
      const hasOverallCalc = (overallMax > 0 && hasValidListPrice);
      const diff = hasOverallCalc ? overallMax - item.listPrice : 0;
      const rate = hasOverallCalc ? (diff / item.listPrice) * 100 : 0;
      
      let pClass = '';
      let sign = '';
      if (hasOverallCalc) {
        if (diff > 0) {
          pClass = 'profit-plus';
          sign = '+';
        } else if (diff < 0) {
          pClass = 'profit-minus';
        }
      }

      let colorsHtml = item.colors.map(c => {
        const prices = [c.chome, c.ichiban, c.rakuen, c.rudeya, c.mobilemix, c.mobaste].filter(p => typeof p === 'number');
        const cMax = prices.length ? Math.max(...prices) : 0;
        const hasColorCalc = (cMax > 0 && hasValidListPrice);
        const cDiff = hasColorCalc ? cMax - item.listPrice : 0;

        const fmtShop = (name, p, s) => {
          if (typeof p !== 'number') return `<div class="m-shop-box"><span class="m-shop-name">${name}</span>-</div>`;
          const isBest = p === cMax ? 'best-price' : '';
          const sClass = s === 'up' ? 'shift-up' : (s === 'down' ? 'shift-down' : 'shift-none');
          return `
            <div class="m-shop-box">
              <span class="m-shop-name">${name}</span>
              <span class="price-num ${isBest} ${sClass}">¥${p.toLocaleString()}</span>
            </div>
          `;
        };

        const trendLabel = (c.trend && c.trend !== '-') ? `<span class="${getTrendClass(c.trend)}" style="margin-left:4px;">${c.trend}</span>` : '';
        
        let colorDiffClass = '';
        let colorDiffSign = '';
        if (hasColorCalc) {
          if (cDiff > 0) {
            colorDiffClass = 'profit-plus';
            colorDiffSign = '+';
          } else if (cDiff < 0) {
            colorDiffClass = 'profit-minus';
          }
        }

        return `
          <div class="m-color-item">
            <div class="m-color-header">
              <div>
                <span class="color-badge c-${c.name}">${c.name}</span>
                <span style="margin-left:6px; font-weight:700; color:var(--red);">${cMax > 0 ? '最高 ¥' + cMax.toLocaleString() : '-'}</span>
              </div>
              <div>
                ${hasColorCalc ? `<span class="${colorDiffClass}">${colorDiffSign}¥${cDiff.toLocaleString()}</span>` : ''}
                ${trendLabel}
              </div>
            </div>
            <div class="m-shop-grid">
              ${fmtShop('一丁目', c.chome, c.cShift)}
              ${fmtShop('一番', c.ichiban, c.iShift)}
              ${fmtShop('楽園', c.rakuen, c.rShift)}
              ${fmtShop('ルデヤ', c.rudeya, c.uShift || '')}
              ${fmtShop('Mix', c.mobilemix, c.mShift)}
              ${fmtShop('モバステ', c.mobaste, c.sShift)}
            </div>
          </div>
        `;
      }).join('');

      fullCardsHtml += `
        <div class="m-card">
          <div class="m-card-header" onclick="this.parentElement.classList.toggle('open')">
            <div class="m-card-title-row">
              <span class="m-model-name">${item.model}</span>
              <span style="font-size:0.75rem; color:var(--text-sub);">定価: ${hasValidListPrice ? '¥' + item.listPrice.toLocaleString() : '-'}</span>
            </div>
            <div class="m-card-metrics">
              <div>
                <span style="font-size:0.75rem; color:var(--text-sub); display:block;">最高買取額</span>
                <span class="m-best-box">${overallMax > 0 ? '¥' + overallMax.toLocaleString() : '-'}</span>
              </div>
              <div style="text-align:right;">
                ${hasOverallCalc ? `<span class="m-diff-box ${pClass}">${sign}¥${diff.toLocaleString()} (${sign}${rate.toFixed(1)}%)</span>` : ''}
                <div class="m-toggle-hint"></div>
              </div>
            </div>
          </div>
          <div class="m-card-body">
            ${colorsHtml}
          </div>
        </div>
      `;
    });

    container.innerHTML = fullCardsHtml;
  }

  function reloadLocalScript() {
    return new Promise((resolve) => {
      const oldScript = document.getElementById('scraped-data-script');
      if (oldScript) oldScript.remove();

      const newScript = document.createElement('script');
      newScript.id = 'scraped-data-script';
      newScript.src = './all_prices.js?t=' + Date.now();
      newScript.onload = () => {
        if (window.SCRAPED_PRICES_DATA && window.SCRAPED_PRICES_DATA.series) {
          cachedData = window.SCRAPED_PRICES_DATA;
        }
        resolve(true);
      };
      newScript.onerror = () => resolve(false);
      document.head.appendChild(newScript);
    });
  }

  // 【SWR即時描画 ＆ 二重フォールバック保護】
  async function loadData() {
    if (window.SCRAPED_PRICES_DATA && window.SCRAPED_PRICES_DATA.series && !cachedData) {
      cachedData = window.SCRAPED_PRICES_DATA;
      document.getElementById('updated-at').textContent = cachedData.updated_at + ' 取得';
      if (cachedData.usd_jpy && cachedData.usd_jpy > 0) {
        document.getElementById('usd-jpy').textContent = 'USD/JPY: ' + Number(cachedData.usd_jpy).toFixed(2);
      }
      renderCurrentSeries();
    }

    await reloadLocalScript();

    try {
      const res = await fetch('./all_prices.json?t=' + Date.now());
      if (res.ok) {
        const jsonData = await res.json();
        if (jsonData && jsonData.series && Object.keys(jsonData.series).length > 0) {
          cachedData = jsonData;
        }
      }
    } catch(e) {}

    if (cachedData) {
      document.getElementById('updated-at').textContent = cachedData.updated_at + ' 取得';
      if (cachedData.usd_jpy && Number(cachedData.usd_jpy) > 0) {
        document.getElementById('usd-jpy').textContent = 'USD/JPY: ' + Number(cachedData.usd_jpy).toFixed(2);
      } else {
        try {
          const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
          const data = await res.json();
          document.getElementById('usd-jpy').textContent = `USD/JPY: ${data.rates.JPY.toFixed(2)}`;
        } catch(e) {}
      }
      renderCurrentSeries();
    } else {
      try {
        const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        const data = await res.json();
        document.getElementById('usd-jpy').textContent = `USD/JPY: ${data.rates.JPY.toFixed(2)}`;
      } catch(e) {}
    }

    renderAds();
  }

  async function manualRefresh() {
    const btn = document.getElementById('refresh-button');
    btn.disabled = true;
    btn.textContent = '🔄 読込中...';
    await loadData();
    btn.textContent = '✅ 完了!';
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '🔄 更新';
    }, 1000);
  }

  // 初期化実行
  updateStickyPositions();
  loadData();
  setInterval(loadData, 300000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') loadData();
  });
</script>

</body>
</html>
